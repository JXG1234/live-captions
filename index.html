<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Captions</title>
<style>
  body { font-family: Arial, sans-serif; padding: 16px 20px; margin: 0; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 20px 0 8px; border-top: 1px solid #ddd; padding-top: 14px; }
  button { padding: 8px 14px; margin-right: 6px; font-size: 15px; cursor: pointer; }

  #link { margin: 12px 0 6px; font-size: 14px; }
  #link.ok { color: #1a7f37; }
  #link.bad { color: #c62828; }
  #status { font-size: 18px; font-weight: bold; min-height: 24px; }
  #preview { margin-top: 8px; color: #444; font-size: 15px; line-height: 1.4; max-height: 4.2em; overflow: hidden; }

  .setting { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 14px; }
  .setting .name { width: 130px; flex: none; }
  .setting input[type=range] { flex: 1; }
  .setting .val { width: 48px; text-align: right; flex: none; color: #555; }
  input[type=color] { width: 44px; height: 30px; padding: 0; border: 1px solid #bbb; background: none; }

  /* Live preview of the overlay */
  #stage {
    margin-top: 12px; padding: 10px; min-height: 150px; display: flex; justify-content: center;
    background: linear-gradient(135deg, #4a90d9, #2c3e50); border-radius: 6px;
  }
  #prevBox { box-sizing: border-box; padding: 6px 10px; font-weight: bold; line-height: 1.3; }
  #prevViewport {
    display: flex; flex-direction: column-reverse; overflow: hidden;
    max-height: calc(var(--lines, 2) * 1.3em);
  }
  .note { color: #666; font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>

<h1>Live Captions</h1>

<button id="startBtn">Start mic</button>
<button id="stopBtn">Stop mic</button>
  <label>
  <input type="checkbox" id="transcriptMode">
  Save transcript to slide notes
</label>

<div id="link">Connecting to the viewer...</div>
<div id="status">Idle</div>
<div id="preview"></div>

<h2>Caption settings</h2>

<div class="setting">
  <label class="name" for="setFg">Text colour</label>
  <input type="color" id="setFg">
</div>
<div class="setting">
  <label class="name" for="setBg">Background colour</label>
  <input type="color" id="setBg">
</div>
<div class="setting">
  <label class="name" for="setOpacity">Background opacity</label>
  <input type="range" id="setOpacity" min="0" max="100" step="5">
  <span class="val" id="valOpacity"></span>
</div>
<div class="setting">
  <label class="name" for="setSize">Text size</label>
  <input type="range" id="setSize" min="20" max="80" step="2">
  <span class="val" id="valSize"></span>
</div>
<div class="setting">
  <label class="name" for="setLines">Lines of text</label>
  <select id="setLines">
    <option>1</option><option>2</option><option>3</option>
    <option>4</option><option>5</option><option>6</option>
  </select>
</div>
<div class="setting">
  <label class="name" for="setWidth">Bar width</label>
  <input type="range" id="setWidth" min="40" max="100" step="5">
  <span class="val" id="valWidth"></span>
</div>
<div class="setting">
  <span class="name">Position</span>
  <label><input type="radio" name="pos" value="top"> Top</label>
  <label><input type="radio" name="pos" value="bottom"> Bottom</label>
</div>
<button id="resetBtn">Reset to defaults</button>

<div id="stage">
  <div id="prevBox"><div id="prevViewport"><div id="prevText"></div></div></div>
</div>

<p class="note">Keep this window open and visible. Closing it stops the captions.</p>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const el = function (id) { return document.getElementById(id); };

let recognition = null;
let wanted = false;     // should the mic be running?
let linked = false;     // has the viewer acknowledged us?

function setStatus(t) { el('status').textContent = t; }
function setLink(t, ok) { el('link').textContent = t; el('link').className = ok ? 'ok' : 'bad'; }
function viewerAlive() { return !!window.opener && !window.opener.closed; }

// The viewer's address varies, so send to '*'. Only caption text and display
// settings go out, and the viewer checks who sent what it receives.
function toViewer(msg) {
  if (!viewerAlive()) return false;
  window.opener.postMessage(msg, '*');
  return true;
}

function tail(t, n) {
  if (t.length <= n) return t;
  return '\u2026' + t.slice(-n).replace(/^\S*\s/, '');
}

/* ---------- Settings ---------- */

const DEFAULTS = { fg: '#ffffff', bg: '#000000', opacity: 90, size: 32, lines: 2, width: 100, position: 'top' };
const STORE_KEY = 'liveCaptionSettings';
const SAMPLE = 'This is how your captions will look. Adjust the colours, size and number of lines to suit the room.';
let settings = Object.assign({}, DEFAULTS);

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && typeof s === 'object') settings = Object.assign({}, DEFAULTS, s);
  } catch (e) {}
}
function saveSettings() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch (e) {}
}

function writeControls() {
  el('setFg').value = settings.fg;
  el('setBg').value = settings.bg;
  el('setOpacity').value = settings.opacity;
  el('setSize').value = settings.size;
  el('setLines').value = String(settings.lines);
  el('setWidth').value = settings.width;
  document.querySelectorAll('input[name=pos]').forEach(function (r) {
    r.checked = (r.value === settings.position);
  });
}

function readControls() {
  settings = {
    fg: el('setFg').value,
    bg: el('setBg').value,
    opacity: Number(el('setOpacity').value),
    size: Number(el('setSize').value),
    lines: Number(el('setLines').value),
    width: Number(el('setWidth').value),
    position: document.querySelector('input[name=pos]:checked').value
  };
}

function updateLabels() {
  el('valOpacity').textContent = settings.opacity + '%';
  el('valSize').textContent = settings.size + 'px';
  el('valWidth').textContent = settings.width + '%';
}

function hexToRgb(h) {
  return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); });
}

function renderPreview() {
  const c = hexToRgb(settings.bg);
  const box = el('prevBox');
  box.style.background = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (settings.opacity / 100) + ')';
  box.style.color = settings.fg;
  box.style.fontSize = (settings.size * 0.4) + 'px';   // scaled down for this small window
  box.style.width = settings.width + '%';
  box.style.setProperty('--lines', settings.lines);
  el('stage').style.alignItems = settings.position === 'bottom' ? 'flex-end' : 'flex-start';
  el('prevText').textContent = SAMPLE;
}

function sendSettings(showSample) {
  if (linked) toViewer({ type: 'settings', settings: settings, preview: !!showSample });
}

function settingsChanged() {
  readControls();
  saveSettings();
  updateLabels();
  renderPreview();
  sendSettings(true);
}

document.querySelectorAll('.setting input, .setting select').forEach(function (c) {
  c.addEventListener('input', settingsChanged);
});

el('resetBtn').onclick = function () {
  settings = Object.assign({}, DEFAULTS);
  saveSettings();
  writeControls();
  updateLabels();
  renderPreview();
  sendSettings(true);
};

loadSettings();
writeControls();
updateLabels();
renderPreview();

/* ---------- Speech recognition ---------- */

function start() {
  if (!SR) {
    setStatus('Speech recognition is not supported here. Use Chrome or Edge.');
    toViewer({ type: 'status', state: 'error', detail: 'unsupported browser' });
    return;
  }
  if (recognition) return;
  wanted = true;

  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-GB';

  recognition.onstart = function () {
    setStatus('Listening...');
    toViewer({ type: 'status', state: 'listening' });
  };

  recognition.onresult = function (e) {

  let text = '';

  for (let i = 0; i < e.results.length; i++) {
    text += e.results[i][0].transcript + ' ';
  }

  text = text.trim();

  el('preview').textContent = tail(text, 300);

  toViewer({
    type: 'caption',
    text: tail(text, 400),
    transcript: el('transcriptMode').checked
  });


};


  recognition.onerror = function (e) {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    setStatus('Error: ' + e.error);
    toViewer({ type: 'status', state: 'error', detail: e.error });
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') wanted = false;
  };

  recognition.onend = function () {
    recognition = null;
    if (wanted) setTimeout(start, 300);                     // Chrome ends sessions on its own
    else toViewer({ type: 'status', state: 'paused' });
  };

  try { recognition.start(); }
  catch (err) { recognition = null; setStatus('Could not start: ' + err.message); }
}

function stop() {
  wanted = false;
  if (recognition) { try { recognition.stop(); } catch (e) {} }
  setStatus('Paused');
  toViewer({ type: 'status', state: 'paused' });
}

el('startBtn').onclick = start;
el('stopBtn').onclick = stop;

/* ---------- Link to the viewer ---------- */

window.addEventListener('message', function (e) {
  if (e.source !== window.opener) return;
  const d = e.data || {};
  if (d.type === 'ack') {
    linked = true;
    setLink('Connected to viewer', true);
    sendSettings(false);                  // apply saved settings straight away
  }
  else if (d.type === 'pause') stop();
  else if (d.type === 'resume') start();
});

let tries = 0;
const helloTimer = setInterval(function () {
  if (linked) { clearInterval(helloTimer); return; }
  if (++tries > 12) {
    clearInterval(helloTimer);
    setLink(viewerAlive()
      ? 'The viewer did not answer. Reload the viewer page and press CC again.'
      : 'No link to the viewer (window.opener is empty). Close this window and open it with the CC button.',
      false);
    return;
  }
  toViewer({ type: 'hello' });
}, 500);

setInterval(function () {
  if (linked && !viewerAlive()) {
    stop();
    setLink('The viewer was closed. You can close this window.', false);
  }
}, 2000);

if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({ name: 'microphone' }).then(function (p) {
    if (p.state === 'granted') start();
    else setStatus('Press Start mic and allow the microphone.');
  }).catch(function () { setStatus('Press Start mic.'); });
} else {
  setStatus('Press Start mic.');
}
</script>

</body>
</html>
